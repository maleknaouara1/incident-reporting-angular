# Included in every location (nginx drops server-level add_header once a location adds its own).

# Complements the CSP meta tag of index.html, which already restricts scripts (autoCsp hashes).
# Adds what only a header can enforce (frame-ancestors) and locks API calls to this origin.
add_header Content-Security-Policy "connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
